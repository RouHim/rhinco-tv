name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: ubuntu-latest
    name: Build x86_64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev

      - name: Build release
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-gnu/release/rhinco-tv

      - name: Package binary
        run: install -m 755 target/x86_64-unknown-linux-gnu/release/rhinco-tv rhinco-tv-x86_64-unknown-linux-gnu

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} rhinco-tv-x86_64-unknown-linux-gnu --clobber

  build-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev pkg-config libwayland-dev libxkbcommon-dev libfontconfig1-dev

      - name: Build release
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Strip binary
        run: strip target/aarch64-unknown-linux-gnu/release/rhinco-tv

      - name: Package binary
        run: install -m 755 target/aarch64-unknown-linux-gnu/release/rhinco-tv rhinco-tv-aarch64-unknown-linux-gnu

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} rhinco-tv-aarch64-unknown-linux-gnu --clobber
